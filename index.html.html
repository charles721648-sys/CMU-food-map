<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中國醫今天吃什麼？｜英才美食地圖</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#25352e;background:#f7f9f4}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e4e9df;padding:18px max(20px,calc((100vw - 1150px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}h1{margin:0;font-size:23px}small,.muted{color:#718075}.logo{color:#237b55;font-weight:800}.wrap{max-width:1150px;margin:auto;padding:24px 18px}.hero{background:linear-gradient(110deg,#e0f5e8,#fff3d9);border-radius:22px;padding:28px;margin-bottom:20px}.hero h2{font-size:28px;margin:0 0 10px}.hero p{margin:0 0 18px;color:#56675c}.btn{border:0;border-radius:12px;background:#21845b;color:#fff;padding:12px 18px;font-weight:700;cursor:pointer;font-size:15px}.btn.secondary{background:#e9f3ec;color:#236e4f}.btn.outline{background:#fff;border:1px solid #d7e2d9;color:#375342}.btn:disabled{opacity:.45;cursor:not-allowed}.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.tab{border:0;background:#e8eee9;padding:12px 18px;border-radius:12px;cursor:pointer;font-weight:700}.tab.active{background:#237b55;color:#fff}.panel{display:none}.panel.active{display:block}.card{background:#fff;border:1px solid #e5eae4;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 2px 10px #193e2310}.mapgrid{display:grid;grid-template-columns:1.45fr 1fr;gap:18px}#map{height:510px;border-radius:16px;z-index:0}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px}select,input,textarea{border:1px solid #dce5dd;border-radius:11px;padding:12px;background:#fff;font:inherit;max-width:100%}input[type=range]{width:100%}.scroll{max-height:510px;overflow:auto}.place{padding:14px;border-bottom:1px solid #edf1ed}.place strong{display:block;margin-bottom:5px}.place p{font-size:13px;color:#68776c;margin:4px 0}.place a{color:#187f56}.stepbar{height:8px;background:#e9efeb;border-radius:9px;overflow:hidden;margin-bottom:12px}.stepbar div{height:100%;background:#2b9366;transition:width .2s}.choicegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:20px 0}.choice{background:#f8faf7;border:2px solid #e0e9e1;padding:15px;border-radius:13px;text-align:left;cursor:pointer;font-size:15px}.choice.selected{background:#e2f4e8;border-color:#27855d;color:#11643f;font-weight:700}.result{border-left:5px solid #2b9366}.rank{color:#238459;font-weight:800}.tag{display:inline-block;background:#eff5ef;color:#53705a;border-radius:7px;padding:4px 8px;margin:4px 5px 4px 0;font-size:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hidden{display:none!important}.notice{font-size:13px;color:#69766c;line-height:1.7}footer{text-align:center;color:#7b877e;font-size:12px;padding:20px}@media(max-width:760px){.mapgrid{grid-template-columns:1fr}#map{height:370px}.scroll{max-height:390px}.hero{padding:23px}.hero h2{font-size:23px}.choicegrid{grid-template-columns:1fr 1fr}header{padding:16px}}</style></head><body><header><div><div class="logo">🍜 CMU FOOD MAP</div><h1>中國醫今天吃什麼？</h1></div><small>英才校區 · 台中北區</small></header><main class="wrap"><section class="hero"><h2>下一餐，交給我們幫你想！ ✨</h2><p>不知道吃什麼？回答幾個問題，幫你從中國醫附近找到最合適的美食。</p><button class="btn" onclick="showTab('quiz')">✨ 幫我決定吃什麼</button> <button class="btn secondary" onclick="showTab('mapPanel')">🗺️ 探索附近美食</button></section><nav class="tabs"><button class="tab active" data-tab="mapPanel" onclick="showTab('mapPanel')">🗺️ 美食地圖</button><button class="tab" data-tab="quiz" onclick="showTab('quiz')">✨ 智慧選餐</button><button class="tab" data-tab="reviews" onclick="showTab('reviews')">⭐ 用餐評價</button></nav><section id="mapPanel" class="panel active"><div class="filters"><select id="radius" onchange="loadPlaces()"><option value="600">校園周邊 600m</option><option value="1000" selected>附近 1km</option><option value="1500">附近 1.5km</option><option value="2000">附近 2km</option></select><select id="category" onchange="renderPlaces()"><option value="all">所有類型</option><option value="restaurant">🍱 餐廳／正餐</option><option value="cafe">☕ 咖啡／飲料</option><option value="snack">🍰 點心／速食</option></select><input id="search" placeholder="搜尋店名或類型…" oninput="renderPlaces()"><button class="btn secondary" onclick="loadPlaces()">↻ 更新地圖</button></div><div class="mapgrid"><div id="map"></div><div class="card"><div class="row" style="justify-content:space-between"><strong>附近店家</strong><small id="count">載入中…</small></div><p class="notice" id="status">正在取得開放地圖店家資料…</p><div class="scroll" id="places"></div></div></div><p class="notice">資料來源：OpenStreetMap / Overpass API，可能有漏店、歇業或資訊不完整；地圖距離為直線距離，實際行走時間及營業狀況請以店家公告為準。</p></section><section id="quiz" class="panel"><div class="card" style="max-width:720px;margin:auto"><div class="row" style="justify-content:space-between"><strong id="stepLabel">智慧選餐問答</strong><small id="stepCount"></small></div><div class="stepbar"><div id="progress"></div></div><h2 id="question"></h2><p class="muted" id="hint"></p><div id="choices" class="choicegrid"></div><div class="row" style="justify-content:space-between"><button class="btn outline" id="back" onclick="prevStep()">← 上一題</button><button class="btn" id="next" onclick="nextStep()" disabled>下一題 →</button></div></div><div id="results" class="hidden" style="max-width:720px;margin:18px auto"></div></section><section id="reviews" class="panel"><div class="card" style="max-width:720px;margin:auto"><h2>⭐ 吃完來評分</h2><p class="muted">每一份回饋，都會讓你的下次推薦更貼近喜好（目前僅儲存在這台裝置）。</p><form id="reviewForm"><label>用餐店家<br><select id="reviewPlace" required style="width:100%;margin:8px 0 15px"></select></label><div class="filters"><label>美味程度<br><select id="taste"><option value="5">5 ★ 非常好吃</option><option value="4">4 ★ 好吃</option><option value="3">3 ★ 普通</option><option value="2">2 ★ 不太喜歡</option><option value="1">1 ★ 不喜歡</option></select></label><label>CP 值<br><select id="value"><option value="5">5 ★ 很划算</option><option value="4">4 ★ 不錯</option><option value="3">3 ★ 普通</option><option value="2">2 ★ 偏貴</option><option value="1">1 ★ 不划算</option></select></label><label>份量<br><select id="portion"><option value="5">5 ★ 很飽</option><option value="4">4 ★ 足夠</option><option value="3">3 ★ 普通</option><option value="2">2 ★ 偏少</option><option value="1">1 ★ 太少</option></select></label><label>等候時間<br><select id="wait"><option value="5">5 ★ 很快</option><option value="4">4 ★ 快</option><option value="3">3 ★ 普通</option><option value="2">2 ★ 有點久</option><option value="1">1 ★ 太久</option></select></label></div><label>整體滿意度<br><select id="overall"><option value="5">5 ★ 會再訪</option><option value="4">4 ★ 滿意</option><option value="3">3 ★ 普通</option><option value="2">2 ★ 不滿意</option><option value="1">1 ★ 很失望</option></select></label><p><textarea id="comment" rows="3" style="width:100%" placeholder="想說什麼？例如：排隊很久、適合多人聚餐、份量超多…"></textarea></p><button class="btn" type="submit">送出評價</button></form><div id="reviewMsg" class="notice"></div></div><div class="card" style="max-width:720px;margin:auto"><h3>我的評價紀錄</h3><div id="reviewHistory"></div></div></section></main><footer>中國醫英才校區美食探索實驗版 · 非中國醫藥大學官方網站</footer><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const center=[24.1576,120.6805];let map,markers,places=[],answers={},step=0,lastRank=[];const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const nav=p=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name+' '+(p.address||'台中市北區'))}`;const reviews=()=>{try{return JSON.parse(localStorage.getItem('cmu-food-reviews')||'[]')}catch{return []}};
function showTab(id){document.querySelectorAll('.panel').forEach(e=>e.classList.toggle('active',e.id===id));document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.dataset.tab===id));if(id==='mapPanel')setTimeout(()=>map?.invalidateSize(),100);if(id==='reviews')renderReviews()}
function initMap(){map=L.map('map').setView(center,15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);markers=L.layerGroup().addTo(map);L.marker(center).addTo(map).bindPopup('<b>中國醫藥大學 英才校區</b><br>學士路91號');L.circle(center,{radius:1000,color:'#2a9564',weight:2,fillOpacity:.035}).addTo(map)}
function hav(lat,lon){const r=Math.PI/180,dlat=(lat-center[0])*r,dlon=(lon-center[1])*r,a=Math.sin(dlat/2)**2+Math.cos(lat*r)*Math.cos(center[0]*r)*Math.sin(dlon/2)**2;return 12742000*Math.asin(Math.min(1,Math.sqrt(a)))}
function cat(tags){if(tags.amenity==='cafe'||tags.amenity==='bar'||tags.shop==='beverages'||tags.shop==='tea')return 'cafe';if(['ice_cream','fast_food'].includes(tags.amenity)||['bakery','confectionery','pastry'].includes(tags.shop))return 'snack';return 'restaurant'}
function typeName(p){return p.category==='cafe'?'☕ 飲料／咖啡':p.category==='snack'?'🍰 點心／速食':'🍱 正餐／餐廳'}
async function loadPlaces(){let r=+document.getElementById('radius').value;document.getElementById('status').textContent='正在從 OpenStreetMap 取得附近店家…';const query=`[out:json][timeout:25];(nwr[amenity~"^(restaurant|fast_food|cafe|ice_cream)$"](around:${r},${center.join(',')});nwr[shop~"^(bakery|confectionery|pastry|beverages|tea)$"](around:${r},${center.join(',')}));out center;`;try{let res=await fetch('https://overpass.kumi.systems/api/interpreter',{method:'POST',body:new URLSearchParams({data:query})});if(!res.ok)throw Error('HTTP '+res.status);let data=await res.json();places=data.elements.map(e=>{let t=e.tags||{},lat=e.lat??e.center?.lat,lon=e.lon??e.center?.lon;return {id:e.type+e.id,name:t['name:zh']||t.name||'',address:[t['addr:street'],t['addr:housenumber']].filter(Boolean).join(''),lat,lon,distance:hav(lat,lon),category:cat(t),cuisine:t.cuisine||'',opening:t.opening_hours||'',takeaway:t.takeaway||'',outdoor:t.outdoor_seating||''}}).filter(p=>p.name&&Number.isFinite(p.distance)&&p.distance<=r).sort((a,b)=>a.distance-b.distance);document.getElementById('status').textContent=`已取得 ${places.length} 間有名稱的店家；價格與等候時間等資料可能缺漏。`;renderPlaces();renderReviewSelect()}catch(e){document.getElementById('status').textContent='店家資料暫時無法載入，請稍後按「更新地圖」重試。需要連接網路。';console.error(e)}}
function renderPlaces(){let c=document.getElementById('category').value,q=document.getElementById('search').value.trim().toLowerCase(),list=places.filter(p=>(c==='all'||p.category===c)&&(p.name.toLowerCase().includes(q)||p.cuisine.toLowerCase().includes(q)));document.getElementById('count').textContent=`${list.length} 間`;markers.clearLayers();document.getElementById('places').innerHTML=list.slice(0,250).map(p=>`<div class="place"><strong>${escapeHtml(p.name)}</strong><p>${typeName(p)} · 約 ${Math.round(p.distance)} 公尺（直線）</p><p>${escapeHtml(p.address||'詳細地址請查看地圖')}</p><a href="${nav(p)}" target="_blank" rel="noopener">Google 地圖導航 ↗</a></div>`).join('')||'<p class="muted">沒有符合條件的店家。</p>';list.forEach(p=>{let color=p.category==='cafe'?'#ba7b3c':p.category==='snack'?'#db8d65':'#26875b';L.circleMarker([p.lat,p.lon],{radius:7,color:'#fff',weight:2,fillColor:color,fillOpacity:1}).addTo(markers).bindPopup(`<b>${escapeHtml(p.name)}</b><br>${typeName(p)} · ${Math.round(p.distance)}m<br><a target="_blank" rel="noopener" href="${nav(p)}">導航</a>`)})}
const questions=[['meal','現在想吃哪一餐？','依照時段挑選適合的餐點',['早餐','午餐','晚餐','宵夜','下午茶／飲料']],['time','你有多少時間可以吃飯？','包含來回交通、等待與用餐時間',['15 分鐘內','15–30 分鐘','30–60 分鐘','1 小時以上']],['transport','想怎麼前往？','以英才校區為出發點',['走路','騎車']],['budget','每個人預算多少？','依預算偏好排序；部分店家尚無菜單價格資料',['100 元以下','100–150 元','150–250 元','250 元以上','不限']],['hunger','現在有多餓？','決定偏向正餐或輕食',['小餓','普通','超級餓']],['mood','今天的心情？','幫你選擇符合心情的食物',['想療癒一下','想吃清爽健康','想吃重口味','想嘗鮮','只想快速解決']],['difficulty','今天選擇困難有多嚴重？','困難越高，越優先提供明確首選',['還好','有一點','非常嚴重，直接幫我決定']],['weather','外面天氣如何？','可手動選擇，避免因天氣影響行程',['晴天／舒適','下雨','很熱','很冷']],['party','幾個人一起吃？','多人聚餐可能需要更多座位',['自己一人','2 人','3–4 人','5 人以上']],['dine','想怎麼吃？','外帶和內用可能影響推薦',['內用','外帶','都可以']],['flavor','有沒有特別想吃的類型？','可以不指定，保留驚喜',['飯類／便當','麵類','異國料理','咖啡／甜點','都可以']],['avoid','有沒有要避開的類型？','目前先提供基本偏好；過敏與飲食限制仍需自行向店家確認',['沒有','不想吃辣','不想吃油炸','偏好素食']]];
function renderStep(){document.getElementById('results').classList.add('hidden');document.querySelector('.card #question').textContent=questions[step][1];document.getElementById('hint').textContent=questions[step][2];document.getElementById('stepCount').textContent=`${step+1} / ${questions.length}`;document.getElementById('progress').style.width=(step+1)/questions.length*100+'%';document.getElementById('choices').innerHTML=questions[step][3].map(v=>`<button class="choice ${answers[questions[step][0]]===v?'selected':''}" onclick="pick(${JSON.stringify(v).replace(/"/g,'&quot;')})">${escapeHtml(v)}</button>`).join('');document.getElementById('back').disabled=step===0;document.getElementById('next').disabled=!answers[questions[step][0]];document.getElementById('next').textContent=step===questions.length-1?'✨ 產生推薦':'下一題 →'}
function pick(v){answers[questions[step][0]]=v;renderStep()}function prevStep(){if(step>0){step--;renderStep()}}function nextStep(){if(!answers[questions[step][0]])return;if(step<questions.length-1){step++;renderStep()}else recommend()}
function score(p){let s=50,why=[],a=answers,review=reviews().filter(x=>x.id===p.id);let travel=p.distance/(a.transport==='騎車'?220:75);let limit=a.time==='15 分鐘內'?15:a.time==='15–30 分鐘'?30:a.time==='30–60 分鐘'?60:90;let estimated=travel*2+22;if(estimated>limit)s-=Math.min(55,(estimated-limit)*2);else{s+=15;why.push('交通時間符合你的安排')}if(a.transport==='走路'){s+=Math.max(-25,20-p.distance/35)}else{s+=Math.max(-10,12-p.distance/150)}if(a.meal==='早餐'&&p.category==='cafe')s+=12;if(a.meal==='下午茶／飲料'&&p.category!=='restaurant'){s+=24;why.push('適合下午茶')}if(['午餐','晚餐'].includes(a.meal)&&p.category==='restaurant')s+=22;if(a.hunger==='超級餓'&&p.category==='restaurant'){s+=18;why.push('偏向能吃飽的正餐')}if(a.hunger==='小餓'&&p.category!=='restaurant')s+=17;if(a.mood==='只想快速解決'&&p.category==='snack')s+=15;if(a.mood==='想療癒一下'&&p.category==='cafe')s+=12;if(a.mood==='想吃清爽健康'&&/salad|vegetarian|vegan|healthy/i.test(p.cuisine))s+=18;if(a.flavor==='咖啡／甜點'&&p.category==='cafe')s+=22;if(a.flavor==='飯類／便當'&&/rice|chinese|taiwanese|japanese/i.test(p.cuisine))s+=16;if(a.flavor==='麵類'&&/noodle|ramen|pho/i.test(p.cuisine))s+=18;if(a.flavor==='異國料理'&&/italian|korean|thai|vietnamese|indian|mexican/i.test(p.cuisine))s+=18;if(a.avoid==='偏好素食'&&/vegetarian|vegan/i.test(p.cuisine))s+=25;if(a.weather==='下雨')s+=Math.max(-15,15-p.distance/35);if(a.party==='自己一人'&&p.category==='restaurant')s+=3;if(review.length){let avg=review.reduce((x,y)=>x+(+y.overall),0)/review.length;s+=(avg-3)*12;why.push('參考了你過去的用餐評價')}if(!why.length)why.push('距離及餐點類型與你的條件相近');return {p,s,why,travel:Math.ceil(travel)}}
function recommend(){let arr=places.map(score).sort((a,b)=>b.s-a.s);lastRank=arr.slice(0,5);let out=document.getElementById('results');out.classList.remove('hidden');document.querySelector('#quiz>.card').classList.add('hidden');let warnings=['⚠️ 這是依條件加權的智慧推薦原型，不是雲端生成式 AI。','店家菜單價格、即時營業、座位、實際排隊時間與過敏資訊未經驗證，因此不會假裝已確認。'];out.innerHTML=`<div class="card"><h2>✨ 幫你挑好了！</h2><p class="muted">根據你的 ${questions.length} 項回答，優先考量交通、時間、用餐類型及你的評價紀錄。</p><button class="btn secondary" onclick="restart()">重新選一次</button></div>`+(lastRank.length?lastRank.map((x,i)=>`<div class="card result"><div class="rank">TOP ${i+1} · 匹配分數 ${Math.round(x.s)}（相對參考）</div><h3>${escapeHtml(x.p.name)}</h3><div><span class="tag">${typeName(x.p)}</span><span class="tag">直線 ${Math.round(x.p.distance)}m</span><span class="tag">單程約 ${x.travel} 分鐘（粗估）</span></div><p>${escapeHtml(x.why.join('、'))}</p><p class="muted">${escapeHtml(x.p.address||'請開啟地圖查看地址')}</p><div class="row"><a href="${nav(x.p)}" target="_blank" rel="noopener">📍 地圖導航</a><button class="btn secondary" onclick="reviewThis('${x.p.id}')">吃完來評分</button></div></div>`).join(''):'<div class="card">目前沒有可推薦的店家。請先連上網路，在美食地圖載入店家。</div>')+`<p class="notice">${warnings.join('<br>')}<br>預算、天氣、飲食限制等條件仍需進一步串接完整商家資料，才可作可靠的硬性篩選。</p>`;out.scrollIntoView({behavior:'smooth',block:'start'})}
function restart(){step=0;answers={};document.querySelector('#quiz>.card').classList.remove('hidden');renderStep();document.getElementById('quiz').scrollIntoView({behavior:'smooth'})}
function renderReviewSelect(){let el=document.getElementById('reviewPlace'),selected=el.value;el.innerHTML='<option value="">請選擇店家</option>'+places.map(p=>`<option value="${escapeHtml(p.id)}">${escapeHtml(p.name)}</option>`).join('');el.value=selected}
function reviewThis(id){showTab('reviews');document.getElementById('reviewPlace').value=id;document.getElementById('reviewForm').scrollIntoView({behavior:'smooth'})}
function renderReviews(){let list=reviews();document.getElementById('reviewHistory').innerHTML=list.length?list.slice().reverse().map(r=>`<div class="place"><strong>${escapeHtml(r.name)} · ${'★'.repeat(r.overall)}</strong><p>${escapeHtml(r.comment||'沒有文字評論')}</p><small>${escapeHtml(r.date)}</small></div>`).join(''):'<p class="muted">還沒有評價，吃完第一餐就來分享吧！</p>'}
document.getElementById('reviewForm').addEventListener('submit',e=>{e.preventDefault();let id=document.getElementById('reviewPlace').value,p=places.find(x=>x.id===id);if(!p)return;let r={id,name:p.name,date:new Date().toLocaleDateString('zh-TW'),comment:document.getElementById('comment').value.slice(0,500)};['taste','value','portion','wait','overall'].forEach(k=>r[k]=+document.getElementById(k).value);let all=reviews();all.push(r);localStorage.setItem('cmu-food-reviews',JSON.stringify(all));document.getElementById('reviewMsg').textContent='✅ 評價已儲存在這台裝置，未來推薦會參考你的滿意度。';e.target.reset();renderReviews()});initMap();renderStep();loadPlaces();</script></body></html>
